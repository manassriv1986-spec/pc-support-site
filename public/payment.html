<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Global PC Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- Navigation Header -->
    <nav class="w-full bg-white border-b border-gray-100 py-4 px-6 flex justify-between items-center shadow-sm">
        <a href="index.html" class="text-xl font-bold text-blue-600 hover:text-blue-700 transition">
            Global PC Support
        </a>
        <a href="index.html" class="text-sm font-medium text-gray-600 hover:text-blue-600 transition flex items-center gap-1">
            &larr; Home
        </a>
    </nav>

    <!-- Main Content -->
    <div class="flex-grow flex items-center justify-center px-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Complete Payment</h2>
            <p class="text-gray-600 mb-2">Case ID: <span id="displayCaseNumber" class="font-mono font-semibold"></span></p>
            <p class="text-3xl font-black text-blue-600 mb-8" id="displayAmount">₹30</p>

            <button id="payBtn" class="w-full bg-green-600 text-white p-4 rounded-lg font-bold hover:bg-green-700 transition shadow-lg">
                Pay Now with Razorpay
            </button>
        </div>
    </div>

    <script>
        const caseId = localStorage.getItem('caseId');
        const caseNumber = localStorage.getItem('caseNumber');
        const amount = localStorage.getItem('amountDue') || 30;
        const userId = localStorage.getItem('userId');

        if (caseNumber) {
            document.getElementById('displayCaseNumber').innerText = caseNumber;
            document.getElementById('displayAmount').innerText = '₹' + amount;
        }

        document.getElementById('payBtn').addEventListener('click', async () => {
            try {
                const orderRes = await fetch('/api/payments/create-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ caseId, amount })
                });
                const orderData = await orderRes.json();

                if (!orderRes.ok) {
                    alert(orderData.message || 'Failed to create order');
                    return;
                }

                const options = {
                    key: orderData.key_id,
                    amount: orderData.amount,
                    currency: orderData.currency,
                    name: "Global PC Support",
                    description: "Technical Support Case Payment",
                    order_id: orderData.id,
                    handler: async function (response) {
                        const verifyRes = await fetch('/api/payments/verify', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                razorpay_order_id: response.razorpay_order_id,
                                razorpay_payment_id: response.razorpay_payment_id,
                                razorpay_signature: response.razorpay_signature,
                                caseId,
                                userId,
                                amount
                            })
                        });

                        const verifyData = await verifyRes.json();
                        if (verifyRes.ok) {
                            alert('Payment successful! Redirecting to log upload...');
                            window.location.href = `upload-logs.html?id=${caseId}`;
                        } else {
                            alert('Payment verification failed: ' + verifyData.message);
                        }
                    },
                    prefill: {
                        name: "Customer",
                        email: "customer@example.com",
                    },
                    theme: {
                        color: "#2563EB"
                    }
                };

                const rzp = new Razorpay(options);
                rzp.open();
            } catch (error) {
                console.error(error);
                alert('Something went wrong during payment initialization.');
            }
        });
    </script>
</body>
</html>
