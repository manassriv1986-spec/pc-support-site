<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Details - Global PC Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <div id="nav-placeholder"></div>

    <div class="flex-grow max-w-2xl mx-auto px-4 py-8 w-full">
        <div class="bg-white p-8 rounded-2xl shadow-xl" id="caseDetailsContainer">
            <p class="text-gray-500">Loading case details...</p>
        </div>
    </div>

    <script>
        fetch('navbar.html').then(res => res.text()).then(data => document.getElementById('nav-placeholder').innerHTML = data);

        const urlParams = new URLSearchParams(window.location.search);
        const caseId = urlParams.get('id');

        async function fetchDetails() {
            try {
                const res = await fetch(`/api/cases/${caseId}`);
                const data = await res.json();
                if (res.ok) {
                    document.getElementById('caseDetailsContainer').innerHTML = `
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-2xl font-bold text-gray-800">Case #${data.caseNumber}</h2>
                            <span class="px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-xs font-semibold uppercase">${data.status}</span>
                        </div>
                        <div class="space-y-4 text-sm text-gray-700">
                            <p><strong>Description:</strong> ${data.description}</p>
                            <p><strong>Amount Paid:</strong> ₹${data.amount}</p>
                            <p><strong>Uploaded File:</strong> ${data.logFileName || 'None yet'}</p>
                        </div>
                        <div class="mt-8">
                            <a href="dashboard.html" class="text-blue-600 hover:underline font-medium">&larr; Back to Dashboard</a>
                        </div>
                    `;
                } else {
                    document.getElementById('caseDetailsContainer').innerHTML = '<p class="text-red-500">Case not found.</p>';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('caseDetailsContainer').innerHTML = '<p class="text-red-500">Error loading case details.</p>';
            }
        }
        if (caseId) fetchDetails();
    </script>
</body>
</html>
