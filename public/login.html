<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Global PC Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex flex-col text-gray-100 bg-cover bg-center relative" style="background-image: url('https://images.unsplash.com/photo-1544197150-b99a580bb7a8?auto=format&fit=crop&w=2500&q=85');">
    <div class="absolute inset-0 bg-slate-950/60 backdrop-blur-[2px] z-0"></div>

    <!-- Navigation Placeholder -->
    <div class="relative z-10 w-full" id="nav-placeholder"></div>

    <!-- Main Content -->
    <div class="relative z-10 flex-grow flex items-center justify-center px-4 py-12">
        <div class="bg-white/15 backdrop-blur-xl border border-white/20 p-8 sm:p-10 rounded-3xl shadow-2xl w-full max-w-md">
            <h2 class="text-2xl font-black text-white text-center mb-1">Welcome Back</h2>
            <p class="text-xs text-gray-300 text-center mb-6">Log in with your registered email to access your dashboard</p>
            
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-200 mb-1">Email Address</label>
                    <input type="email" id="loginEmail" required placeholder="Enter your email" class="w-full p-3 bg-white/5 border border-white/20 rounded-xl text-white placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white p-4 rounded-xl font-bold hover:bg-blue-500 transition shadow-lg shadow-blue-600/30 mt-2">
                    Login to Dashboard
                </button>
            </form>

            <p class="text-xs text-center text-gray-300 mt-6">
                Don't have an account? <a href="register.html" class="text-blue-400 font-semibold hover:underline">Register here</a>
            </p>
        </div>
    </div>

    <script>
        // Load the shared modular navbar
        fetch('navbar.html')
            .then(res => res.text())
            .then(data => document.getElementById('nav-placeholder').innerHTML = data);

        // Handle login form submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                
                if (res.ok) {
                    localStorage.setItem('userId', data.userId);
                    localStorage.setItem('userName', data.name || 'User');
                    alert('Login successful!');
                    window.location.href = 'dashboard.html';
                } else {
                    alert(data.message || 'Login failed');
                }
            } catch (err) {
                console.error(err);
                alert('Server error during login.');
            }
        });
    </script>
</body>
</html>
