<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Describe Issue - Global PC Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- Navigation Header -->
    <nav class="w-full bg-white border-b border-gray-100 py-4 px-6 flex justify-between items-center shadow-sm">
        <a href="index.html" class="text-xl font-bold text-blue-600 hover:text-blue-700 transition">
            Global PC Support
        </a>
        <a href="index.html" class="text-sm font-medium text-gray-600 hover:text-blue-600 transition flex items-center gap-1">
            &larr; Home
        </a>
    </nav>

    <!-- Main Content -->
    <div class="flex-grow flex items-center justify-center px-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-xl">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Describe Your Issue</h2>
            <form id="supportForm" class="space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <label class="border p-4 rounded-xl cursor-pointer flex flex-col justify-between hover:border-blue-500 transition">
                        <div>
                            <span class="font-bold text-blue-600 block mb-1">Normal Support</span>
                            <span class="text-xs text-gray-500">General questions, speed issues, app fixes.</span>
                        </div>
                        <div class="mt-4 flex items-center justify-between">
                            <span class="font-black text-gray-800">₹30</span>
                            <input type="radio" name="tier" value="30" checked class="text-blue-600">
                        </div>
                    </label>

                    <label class="border p-4 rounded-xl cursor-pointer flex flex-col justify-between hover:border-blue-500 transition">
                        <div>
                            <span class="font-bold text-red-600 block mb-1">Advanced Support</span>
                            <span class="text-xs text-gray-500">Blue screens, critical errors, log analysis.</span>
                        </div>
                        <div class="mt-4 flex items-center justify-between">
                            <span class="font-black text-gray-800">₹50</span>
                            <input type="radio" name="tier" value="50" class="text-blue-600">
                        </div>
                    </label>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Describe the problem in detail</label>
                    <textarea id="description" rows="4" required placeholder="e.g. My PC restarts every time I open Chrome..." class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white p-4 rounded-lg font-bold hover:bg-blue-700 transition shadow-lg">
                    Confirm Case & Proceed to Payment
                </button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('supportForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const userId = localStorage.getItem('userId');
            if (!userId) {
                alert('Session expired. Please register first.');
                window.location.href = 'register.html';
                return;
            }

            const description = document.getElementById('description').value;
            const amount = document.querySelector('input[name="tier"]:checked').value;

            try {
                const res = await fetch('/api/cases/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, description, amount })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('caseId', data.caseId);
                    localStorage.setItem('caseNumber', data.caseNumber);
                    localStorage.setItem('amountDue', amount);
                    window.location.href = 'payment.html';
                } else {
                    alert(data.message || 'Failed to create case');
                }
            } catch (err) {
                console.error(err);
                alert('Server error creating support case.');
            }
        });
    </script>
</body>
</html>
