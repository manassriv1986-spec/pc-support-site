<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Diagnostics - Global PC Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- Navigation Header -->
    <nav class="w-full bg-white border-b border-gray-100 py-4 px-6 flex justify-between items-center shadow-sm">
        <a href="index.html" class="text-xl font-bold text-blue-600 hover:text-blue-700 transition">
            Global PC Support
        </a>
        <a href="index.html" class="text-sm font-medium text-gray-600 hover:text-blue-600 transition flex items-center gap-1">
            &larr; Home
        </a>
    </nav>

    <!-- Main Content -->
    <div class="flex-grow flex items-center justify-center px-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-xl text-center">
            <div class="mb-4">
                <span class="bg-green-100 text-green-800 text-xs font-semibold px-3 py-1 rounded-full">Payment Verified</span>
            </div>
            <h2 class="text-3xl font-bold text-gray-800 mb-2">Upload Diagnostic Logs</h2>
            <p class="text-gray-600 mb-6 text-sm">Please upload the log file or ZIP package generated by our troubleshooting script.</p>

            <form id="uploadForm" class="space-y-6 text-left">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Select Log File (.zip, .txt, .log)</label>
                    <input type="file" id="logFile" required class="w-full p-3 border border-dashed rounded-lg bg-gray-50 focus:outline-none">
                </div>

                <button type="submit" id="uploadBtn" class="w-full bg-blue-600 text-white p-4 rounded-lg font-bold hover:bg-blue-700 transition shadow-lg">
                    Upload Logs & Complete Case
                </button>
            </form>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const caseId = urlParams.get('id');

        if (!caseId) {
            alert('Invalid case session.');
            window.location.href = 'index.html';
        }

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('logFile');
            if (fileInput.files.length === 0) {
                alert('Please select a file to upload.');
                return;
            }

            const formData = new FormData();
            formData.append('logFile', fileInput.files[0]);
            formData.append('caseId', caseId);

            const uploadBtn = document.getElementById('uploadBtn');
            uploadBtn.innerText = 'Uploading...';
            uploadBtn.disabled = true;

            try {
                const response = await fetch('/api/cases/upload-logs', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                if (response.ok) {
                    alert('Logs uploaded successfully!');
                    window.location.href = `case-details.html?id=${caseId}`;
                } else {
                    alert(result.message || 'Upload failed');
                    uploadBtn.innerText = 'Upload Logs & Complete Case';
                    uploadBtn.disabled = false;
                }
            } catch (error) {
                console.error(error);
                alert('Error uploading logs to server.');
                uploadBtn.innerText = 'Upload Logs & Complete Case';
                uploadBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
