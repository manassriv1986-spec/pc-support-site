<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Global PC Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- Navigation Header -->
    <nav class="w-full bg-white border-b border-gray-100 py-4 px-6 flex justify-between items-center shadow-sm">
        <a href="index.html" class="text-xl font-bold text-blue-600 hover:text-blue-700 transition">
            Global PC Support
        </a>
        <a href="index.html" class="text-sm font-medium text-gray-600 hover:text-blue-600 transition flex items-center gap-1">
            &larr; Home
        </a>
    </nav>

    <!-- Main Content -->
    <div class="flex-grow max-w-4xl mx-auto px-4 py-8 w-full">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Support Dashboard</h2>
        <div id="casesList" class="space-y-4">
            <p class="text-gray-500">Loading cases...</p>
        </div>
    </div>

    <script>
        async function loadCases() {
            try {
                const res = await fetch('/api/cases/all');
                const cases = await res.json();
                const container = document.getElementById('casesList');
                
                if (!cases.length) {
                    container.innerHTML = '<p class="text-gray-500">No support cases found.</p>';
                    return;
                }

                container.innerHTML = cases.map(c => `
                    <div class="bg-white p-6 rounded-xl shadow-md flex justify-between items-center">
                        <div>
                            <span class="font-mono font-bold text-blue-600">${c.caseNumber}</span>
                            <p class="text-sm text-gray-600 mt-1">${c.description}</p>
                            <span class="inline-block mt-2 text-xs px-2 py-1 bg-gray-100 rounded uppercase font-semibold">${c.status}</span>
                        </div>
                        <a href="case-details.html?id=${c._id}" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-blue-700 transition">View</a>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
                document.getElementById('casesList').innerHTML = '<p class="text-red-500">Error loading cases.</p>';
            }
        }
        loadCases();
    </script>
</body>
</html>
